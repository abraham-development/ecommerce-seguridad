name: Azure Dev MVP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 3274731e-9035-49fa-9d05-11c978277669
  AZURE_RESOURCE_GROUP: ecommerce

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Azure dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        env:
          AFCR_RESOURCE_SUFFIX: ${{ vars.AFCR_RESOURCE_SUFFIX }}
          POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          ENTRA_EXTERNAL_ID_CLIENT_ID: ${{ secrets.ENTRA_EXTERNAL_ID_CLIENT_ID }}
          ENTRA_EXTERNAL_ID_CLIENT_SECRET: ${{ secrets.ENTRA_EXTERNAL_ID_CLIENT_SECRET }}
          ENTRA_EXTERNAL_ID_ISSUER: ${{ secrets.ENTRA_EXTERNAL_ID_ISSUER }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          az deployment group what-if \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam

      - name: Deploy infrastructure
        id: infra
        env:
          AFCR_RESOURCE_SUFFIX: ${{ vars.AFCR_RESOURCE_SUFFIX }}
          POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          ENTRA_EXTERNAL_ID_CLIENT_ID: ${{ secrets.ENTRA_EXTERNAL_ID_CLIENT_ID }}
          ENTRA_EXTERNAL_ID_CLIENT_SECRET: ${{ secrets.ENTRA_EXTERNAL_ID_CLIENT_SECRET }}
          ENTRA_EXTERNAL_ID_ISSUER: ${{ secrets.ENTRA_EXTERNAL_ID_ISSUER }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          az deployment group create \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam \
            --query "properties.outputs" \
            -o json > deployment-outputs.json
          echo "web_app_name=$(jq -r '.webAppName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "web_app_url=$(jq -r '.webAppUrl.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: |
          zip -r app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x ".next/*" \
            -x "deployment-outputs.json" \
            -x "app.zip"

      - name: Deploy app package
        run: |
          az webapp deploy \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.web_app_name }}" \
            --src-path app.zip \
            --type zip

      - name: Report URL
        run: echo "App URL: ${{ steps.infra.outputs.web_app_url }}"
